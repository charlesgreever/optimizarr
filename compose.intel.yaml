# Household Intel UHD 770 (VAAPI) backup. ffmpeg uses /dev/dri/renderD128.
# Restore by copying over compose.yaml.
name: polisharr
services:
  polisharr:
    container_name: polisharr
    image: ghcr.io/charlesgreever/polisharr:latest
    # build: .
    ports:
      - "7373:7373"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      CONFIG_DIR: /config
    volumes:
      - /home/cgreever/appdata/arr/polisharr/config:/config
      - /mnt/nas:/mnt/nas
    devices:
      - /dev/dri:/dev/dri
    # Host render/video GIDs so ffmpeg can open /dev/dri after drop-root.
    group_add:
      - "991"
      - "44"
    networks:
      - arr_net

networks:
  arr_net:
    external: true
