# Household NVIDIA compose (RTX 4070 Ti SUPER).
# Intel backup: compose.intel.yaml
services:
  polisharr:
    build: .
    ports:
      - "7373:7373"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      CONFIG_DIR: /config
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # Optional. Command that reads a 16 kHz mono WAV and prints {"language":"en","probability":0.94}
      # WHISPER_LID: /usr/local/bin/whisper-lid
    volumes:
      - /home/cgreever/appdata/arr/optimizarr/config:/config
      - /mnt/nas:/mnt/nas
    networks:
      - arr_net
    runtime: nvidia

networks:
  arr_net:
    external: true
