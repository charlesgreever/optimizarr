name: optimizarr
services:
  optimizarr:
    build: .
    image: optimizarr:local
    container_name: optimizarr
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    ports:
      - "7373:7373"
    volumes:
      # Same layout as the other *arrs on ubuntuserver
      - /home/cgreever/appdata/arr/optimizarr/config:/config
      - /mnt/nas:/mnt/nas
      - /mnt/nas/sabdownloads/complete:/complete
      - /mnt/nas/sabdownloads/incomplete:/incomplete
    networks:
      - arr_net
    # Uncomment if the host has the NVIDIA container toolkit (Frigate-style):
    # runtime: nvidia
    labels:
      icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/radarr.png

networks:
  arr_net:
    external: true
