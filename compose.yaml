services:
  optimizarr:
    build: .
    container_name: optimizarr
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "7373:7373"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      CONFIG_DIR: /config
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      OPTIMIZARR_WIDGET_KEY: ${OPTIMIZARR_WIDGET_KEY:-}
    volumes:
      - ./config:/config
      - /mnt/nas:/mnt/nas
      - /mnt/nas/review-path:/review
    networks:
      - arr_net

networks:
  arr_net:
    external: true
