# Household NVIDIA compose (RTX 4070 Ti SUPER). Same as compose.yaml.
name: polisharr
services:
  polisharr:
    container_name: polisharr
    image: ghcr.io/charlesgreever/polisharr:latest
    # build: .
    ports:
      - "7373:7373"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      CONFIG_DIR: /config
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      WHISPER_LID: /usr/local/bin/whisper-lid
      PGS_OCR: /usr/local/bin/pgs-ocr
    volumes:
      - /home/cgreever/appdata/arr/polisharr/config:/config
      - /mnt/nas:/mnt/nas
    networks:
      - arr_net
    runtime: nvidia

networks:
  arr_net:
    external: true
