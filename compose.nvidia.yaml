# NVIDIA GPU sample. Copy this file, set the media path, then:
#   docker compose -f compose.nvidia.yaml up -d --build
#
# The media bind must be the same path Radarr and Sonarr report.
# Join their Docker network if Settings should use http://radarr:7878.

services:
  optimizarr:
    build: .
    ports:
      - "7373:7373"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      CONFIG_DIR: /config
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ./config:/config
      - /path/to/media:/path/to/media
    runtime: nvidia
